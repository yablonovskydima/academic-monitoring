[project]
name = "auth-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "yablonovskydmutro1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
auth-service = "auth_service.main:run"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
